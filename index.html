<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Affirmations Yes</title>
</head>
<body>
  <h2>Affirmations modified Response</h2>
  <div id="affirm" style="border-radius: 8px; width: 600px; height: 100px; border: 1px solid aquamarine; padding-left: 10px;">
  </div>
  <button id="btn" style="border-radius: 8px; width: 100px; height: 40px; border: 1px solid aquamarine; background-color: rgb(51, 110, 51); color: white; cursor: pointer; margin-top: 10px;">Get response</button>

  <script>
    const affirmation = document.getElementById("affirm");
    const btn = document.getElementById("btn");

    btn.addEventListener("click", getYes);

    async function getYes() {
      affirmation.innerHTML = "";
      try {
        const response = await fetch("https://yes.lavx.hu/yes");
        const data = await response.json();
        console.log(data);
        
        const note = document.createElement("p");
        note.innerText = data.reason;
        affirmation.appendChild(note);
      } catch (error) {
        console.error(error.message);
      }
    }
  </script>
</body>
</html>
